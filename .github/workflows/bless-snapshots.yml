name: Bless Snapshots

on: workflow_dispatch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bless:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snapshots
        run: swift run GriddleDemo --output-dir /tmp/demo-output

      - name: Update blessed snapshots
        run: |
          rm -rf Tests/Snapshots
          cp -r /tmp/demo-output/frames Tests/Snapshots

      - name: Commit blessed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tests/Snapshots
          git commit -m "Bless CI snapshots" || echo "No changes to commit"
          git push
