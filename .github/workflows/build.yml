name: Build

on: [push]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build.sh

      - name: Zip app bundle
        run: zip -r Griddle.zip .build/Griddle.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Griddle
          path: Griddle.zip
