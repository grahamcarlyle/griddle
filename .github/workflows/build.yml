name: Build

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Snapshot test
        run: swift run GriddleDemo --output-dir /tmp/demo-output --blessed-dir Tests/Snapshots

      - name: Build app bundle
        run: ./build.sh
        env:
          GRIDDLE_VERSION: ${{ github.run_number }}

      - name: Zip app bundle
        run: zip -r Griddle.zip .build/Griddle.app install.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Griddle
          path: Griddle.zip

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: Griddle.zip
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }}.

            **Install:** Download `Griddle.zip`, unzip, and run `./install.sh` — this copies `Griddle.app` to `/Applications` and removes the quarantine flag.
            You can also pass a custom path: `./install.sh path/to/Griddle.app`

            After granting Accessibility permission, the app will appear as "Griddle (build ${{ github.run_number }})" in System Settings. You can remove old build entries from the Accessibility list.
